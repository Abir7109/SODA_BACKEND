name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint (real-bug rules only)
        run: ruff check backend
      - name: Byte-compile
        run: python -m compileall -q backend

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        # Lockfile must contain all platforms' optional deps (@rollup/@esbuild binaries).
        # npm can't add missing ones post-hoc — regenerate with `npm install --package-lock-only`
        # in a dir with ONLY package.json if a platform entry goes missing (npm/cli#4828).
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
