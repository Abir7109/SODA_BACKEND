name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint (real-bug rules only)
        run: ruff check backend
      - name: Byte-compile
        run: python -m compileall -q backend

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        # npm ci: lockfile is Windows-only, missing @rollup/@esbuild linux entries (npm/cli#4828).
        # npm install resolves platform optional deps at install time.
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
